[project]
name = "db-tool"
version = "0.1.0"
description = "DB Gateway: browser SQL access to ParadeDB with per-user PostgreSQL roles"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite",
    "fastapi",
    "httpx",
    "openfga-sdk",
    "psycopg[binary,pool]",
    "pydantic-settings",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs docker compose services (ParadeDB, OpenFGA)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
